[package]
name = "mu-console-layout"
version = "0.1.1"
edition = "2021"
authors = ["LMA1980"]
repository = "https://github.com/LMA1980/mu-console-layout"
description = "MuConsole pure layout solver: breakpoints, frame solver and metric-aware CRT column grids (zero page scroll)"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[lib]
name = "mu_console_layout"
path = "src/lib.rs"

[dependencies]
mu-console-protocol = { version = "0.1.1", git = "https://github.com/LMA1980/mu-console-protocol.git", branch = "main" }
mu-console-theme = { version = "0.1.1", git = "https://github.com/LMA1980/mu-console-theme.git", branch = "main" }
